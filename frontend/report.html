<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__</title>
  <style>__STYLE__</style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">G</div>
      <div class="project-heading">
        <h1 id="project-title"></h1>
        <p id="project-subtitle"></p>
      </div>
      <div class="run-summary" id="run-summary"></div>
      <div class="top-actions">
        <span class="connection-status" id="connection-status"></span>
        <button id="rerun-button" type="button" hidden></button>
      </div>
    </header>

    <section class="canvas-stage" id="canvas-stage" tabindex="0" aria-label="系统发育节点式工作流">
      <div class="canvas-world" id="canvas-world">
        <svg class="edge-layer" id="edge-layer" width="1" height="1" aria-hidden="true"></svg>
        <div id="node-layer"></div>
      </div>

      <nav class="canvas-toolbar" aria-label="画布工具">
        <button type="button" data-tool="fit" title="聚焦全部" aria-label="聚焦全部"></button>
      </nav>

      <div class="node-composer" id="node-composer" hidden></div>

      <div class="zoom-controls" aria-label="缩放控制">
        <button type="button" id="zoom-out" aria-label="缩小">−</button>
        <output id="zoom-value">100%</output>
        <button type="button" id="zoom-in" aria-label="放大">＋</button>
      </div>
      <div class="canvas-hint">拖动空白平移 · 滚轮缩放 · 拖动节点整理</div>
    </section>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="right-drawer" id="right-drawer" aria-label="结果与反馈" aria-hidden="true"></aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input id="annotation-import" type="file" accept="application/json,.json" hidden>
  </main>

  <script id="ggtree-air-payload" type="application/json">__PAYLOAD__</script>
  <script>window.__GGTREE_AIR_API_TOKEN__='__GGTREE_AIR_TOKEN_VALUE__'</script>
  <script>__APP__</script>
</body>
</html>
