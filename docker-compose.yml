services:
  ggtree-air:
    build: .
    image: ggtree-air:0.5.0
    environment:
      GGTREE_AIR_ALLOW_NON_LOOPBACK: "1"
    ports:
      - "7391:7391"
    volumes:
      - ./results:/workspace/results
      - ./data:/workspace/data:ro
    working_dir: /workspace
    command:
      - serve
      - --workspace
      - /workspace/results/demo
      - --host
      - 0.0.0.0
      - --port
      - "7391"
